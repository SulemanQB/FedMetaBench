experiment:
  name: "fedmetaenv_fedavg_gpu0_20260413"
  seed: 42
  device: "cuda"

dataset:
  name: "beijing"
  data_dir: "./data"
  target_pollutant: "PM2.5"
  window_size: 24
  k_days: 7

model:
  type: "lstm"
  input_dim: 17
  hidden_dim: 64
  n_layers: 2
  dropout: 0.2

algorithm:
  name: "fedavg"
  inner_lr: 0.01
  outer_lr: 0.001
  inner_steps: 5
  clients_per_round: 5
  local_meta_steps: 3

training:
  n_rounds: 30
  eval_every: 5

evaluation:
  k_days_list: [1, 3, 7, 14, 30]
  loso: true

output:
  results_dir: "./results"
