# FedMetaTemporal default configuration

experiment:
  name: "fedmeta_temporal_default"
  seed: 42
  device: "auto"

dataset:
  n_clients: 10
  n_samples_per_client: 2000
  n_features: 20
  n_classes: 2
  drift_type: "sudden"  # sudden, gradual, recurring, incremental
  n_drifts: 3

model:
  type: "simple"  # simple for the generated tabular tasks; neural_cde expects sequences
  input_dim: 20
  hidden_dim: 64
  n_classes: 2
  n_layers: 2
  dropout: 0.2

algorithm:
  name: "temporal_fedavg"  # temporal_fedavg, ewc_maml, temporal_maml
  inner_lr: 0.01
  outer_lr: 0.001
  inner_steps: 3
  temporal_decay: 0.9
  ewc_lambda: 0.5
  clients_per_round: 5

training:
  n_rounds: 30
  n_tasks_per_client: 5
  k_shot: 20
  eval_every: 5

output:
  results_dir: "./results"
