# FairFedMeta smoke config (CPU, short)
experiment:
  name: "fairfedmeta_smoke"
  seed: 42
  device: "cpu"

dataset:
  name: "eicu"
  data_path: null
  n_samples: 800
  n_hospitals: 8
  seq_len: 24
  n_features: 15
  n_groups: 5
  k_shot: 5
  meta_train_ratio: 0.7

model:
  type: "lstm"
  input_dim: 15
  hidden_dim: 32
  n_layers: 1
  n_classes: 2
  dropout: 0.1

algorithm:
  name: "fair_fedavg"
  inner_lr: 0.01
  outer_lr: 0.001
  inner_steps: 2
  fairness_penalty: 1.0
  lambda_lr: 0.01
  clients_per_round: 3

training:
  n_rounds: 3
  eval_every: 1
  save_every: 10

output:
  results_dir: "./results"
  save_model: false
